<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Survey Submissions — Emmerson Locksmiths</title>
<meta name="theme-color" content="#12304d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Survey Admin" />
<link rel="manifest" href="manifest-admin.json" />
<link rel="icon" type="image/x-icon" href="icons/admin-favicon.ico" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/admin-favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/admin-favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/admin-apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #12304d;
    --brand-light: #e9eef3;
    --brand-mid: #2e5f93;
    --bg: #f6f3ec;
    --surface: #ffffff;
    --surface2: #efebe2;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.22);
    --text: #1a1a18;
    --text-mid: #555550;
    --text-muted: #888880;
    --radius: 10px;
    --radius-lg: 14px;
    --accent: #b8913f;
    --accent-light: #f1e7d0;
    --font-head: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --danger: #b53c2a;
    --success: #2a7a4a;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--text);
    font-size: 15px; line-height: 1.5; min-height: calc(100vh - 55px);
  }
  .brand-bar { background: var(--brand); border-bottom: 1px solid rgba(255,255,255,0.10); padding: 13px 16px 11px; display: flex; justify-content: center; }
  .brand-bar img { display: block; height: 30px; width: auto; max-width: 100%; }
  body:has(#page-login.active) .brand-bar { border-bottom: 3px solid var(--accent); padding-bottom: 9px; }

  .app-header {
    background: var(--brand); color: #fff;
    padding: 14px 16px 12px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between; min-height: 58px;
    border-bottom: 3px solid var(--accent);
  }
  .app-header h1 { font-family: var(--font-head); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .app-header .sub { font-size: 12px; opacity: 0.7; margin-top: 1px; }
  .header-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.12); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .back-btn { background: none; border: none; color: #fff; font-size: 14px; font-family: inherit; display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 4px 0; opacity: 0.9; }
  .back-btn i { font-size: 18px; }
  .signout-btn { background: none; border: none; color: #fff; opacity: 0.8; font-size: 13px; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 4px; }

  .page { display: none; }
  .page.active { display: block; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }

  /* Login */
  .login-wrap { max-width: 360px; margin: 0 auto; padding: 80px 20px 0; text-align: center; }
  .login-wrap .lock-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--brand-light); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 28px; color: var(--brand); }
  .login-wrap h2 { font-family: var(--font-head); font-size: 20px; font-weight: 600; color: var(--brand); margin-bottom: 4px; }
  .login-wrap p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
  .field { margin-bottom: 12px; text-align: left; }
  .field label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px; font-weight: 500; }
  .field input { width: 100%; font-size: 15px; font-family: inherit; padding: 11px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface2); color: var(--text); }
  .field input:focus { outline: 2px solid var(--brand-mid); outline-offset: 1px; border-color: var(--brand-mid); background: var(--surface); }
  .primary-btn { width: 100%; padding: 14px; background: var(--brand); color: #fff; border: none; border-radius: var(--radius-lg); font-size: 15px; font-family: inherit; font-weight: 600; cursor: pointer; margin-top: 6px; }
  .primary-btn:active { opacity: 0.85; }
  .login-error { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }

  /* Dashboard */
  .page-intro { margin-bottom: 16px; }
  .page-intro h2 { font-family: var(--font-head); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; color: var(--brand); margin-bottom: 3px; }
  .page-intro p { font-size: 13px; color: var(--text-muted); }

  /* Dashboard tabs + Insights */
  .tabs { display: flex; background: var(--surface2); border-radius: var(--radius-lg); padding: 4px; margin-bottom: 16px; gap: 4px; }
  .tab-btn { flex: 1; border: none; background: none; font-family: var(--font-head); font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--text-muted); padding: 10px 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tab-btn.active { background: var(--brand); color: #fff; box-shadow: 0 1px 3px rgba(18,48,77,0.25); }
  .range-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .range-chip { border: 0.5px solid var(--border-strong); background: var(--surface); color: var(--text-mid); font-family: inherit; font-size: 12px; font-weight: 600; padding: 6px 13px; border-radius: 20px; cursor: pointer; }
  .range-chip.active { background: var(--accent-light); border-color: var(--accent); color: var(--brand); }
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px; border-top: 3px solid var(--accent); }
  .kpi-val { font-family: var(--font-head); font-size: 28px; font-weight: 700; color: var(--brand); line-height: 1.1; }
  .kpi-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-top: 5px; }
  .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; }
  .stat-card h3 { font-family: var(--font-head); font-size: 14px; font-weight: 600; color: var(--brand); margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
  .stat-card h3 i { color: var(--accent); font-size: 17px; }
  .split-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface2); }
  .split-bar div { height: 100%; }
  .split-legend { display: flex; justify-content: space-between; margin-top: 9px; font-size: 12px; color: var(--text-mid); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .col-chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
  .col-n { font-size: 11px; font-weight: 600; color: var(--brand); margin-bottom: 3px; }
  .col-bar { width: 100%; max-width: 34px; background: var(--brand); border-radius: 5px 5px 0 0; min-height: 2px; }
  .col-bar.hi { background: var(--accent); }
  .col-lab { font-size: 10px; color: var(--text-muted); margin-top: 6px; white-space: nowrap; }
  .hbar-row { margin-bottom: 9px; }
  .hbar-row:last-child { margin-bottom: 0; }
  .hbar-top { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; margin-bottom: 3px; }
  .hbar-top span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar-top span:last-child { font-weight: 600; color: var(--brand); }
  .hbar-track { height: 7px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .hbar-fill { height: 100%; background: var(--brand-mid); border-radius: 4px; }
  .stat-empty { font-size: 12.5px; color: var(--text-muted); }
  .stat-note { font-size: 11.5px; color: var(--text-muted); text-align: center; margin-top: 4px; }
  .archive-btn {
    width: 100%; padding: 13px; margin-top: 10px; background: var(--accent-light); color: var(--brand);
    border: 0.5px solid var(--accent); border-radius: var(--radius-lg);
    font-size: 14px; font-family: inherit; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .archive-btn:active { opacity: 0.8; }
  .archive-btn:disabled { opacity: 0.55; cursor: default; }
  .archived-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--surface2); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }

  .sub-card {
    background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px; margin-bottom: 10px; cursor: pointer; display: flex; gap: 12px; align-items: center;
  }
  .sub-card:active { background: var(--surface2); }
  .sub-badge { width: 40px; height: 40px; border-radius: 10px; background: var(--brand-light); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .sub-info { flex: 1; min-width: 0; }
  .sub-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .type-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--brand-light); color: var(--brand); text-transform: uppercase; letter-spacing: 0.03em; }
  .sub-arrow { color: var(--text-muted); font-size: 18px; }

  /* Detail */
  .detail-header-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; }
  .detail-header-card h2 { font-family: var(--font-head); font-size: 18px; font-weight: 600; color: var(--brand); margin-bottom: 4px; }
  .detail-header-card .meta-row { font-size: 13px; color: var(--text-mid); margin-top: 6px; }
  .detail-header-card .meta-row span { color: var(--text-muted); }
  .detail-header-card .meta-row a { color: var(--brand-mid); text-decoration-color: rgba(46,95,147,0.35); text-underline-offset: 2px; }

  .door-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 10px; }
  .door-card-header { padding: 11px 14px; background: var(--brand-light); font-size: 14px; font-weight: 600; color: var(--brand); display: flex; align-items: center; gap: 10px; }
  .door-num { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .door-card-body { padding: 12px 14px; }
  .df { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 0.5px solid var(--border); }
  .df:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .df-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 3px; }
  .df-val { font-size: 13px; color: var(--text); }
  .door-photos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .door-photos img { width: 64px; height: 64px; object-fit: cover; border-radius: 7px; border: 0.5px solid var(--border); cursor: pointer; }

  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 400; align-items: center; justify-content: center; padding: 20px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 20px; transition: transform 0.3s ease; z-index: 500; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .actions-zone { margin-top: 24px; }
  .export-btn {
    width: 100%; padding: 13px; background: var(--surface); color: var(--brand);
    border: 0.5px solid rgba(26,58,92,0.35); border-radius: var(--radius-lg);
    font-size: 14px; font-family: inherit; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .export-btn:active { background: var(--brand-light); }
  .export-btn:disabled { opacity: 0.55; cursor: default; }

  .danger-zone { margin-top: 10px; padding-top: 16px; border-top: 0.5px solid var(--border); }
  .delete-btn {
    width: 100%; padding: 13px; background: var(--surface); color: var(--danger);
    border: 0.5px solid rgba(181,60,42,0.35); border-radius: var(--radius-lg);
    font-size: 14px; font-family: inherit; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .delete-btn:active { background: rgba(181,60,42,0.08); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 600; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--surface); border-radius: 18px 18px 0 0; padding: 24px 20px 32px; width: 100%; max-width: 480px; }
  .modal-title { font-family: var(--font-head); font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .modal-msg { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
  .modal-btns { display: flex; flex-direction: column; gap: 10px; }
  .modal-confirm { width: 100%; padding: 14px; background: var(--danger); color: #fff; border: none; border-radius: var(--radius-lg); font-size: 15px; font-family: inherit; font-weight: 600; cursor: pointer; }
  .modal-cancel { width: 100%; padding: 14px; background: var(--surface2); color: var(--text); border: 0.5px solid var(--border-strong); border-radius: var(--radius-lg); font-size: 15px; font-family: inherit; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>

<div class="brand-bar"><img src="icons/logo-white.png" alt="Emmerson Locksmiths and Security" width="186" height="30" /></div>

<!-- LOGIN -->
<div class="page active" id="page-login">
  <div class="login-wrap">
    <div class="lock-icon"><i class="ti ti-lock"></i></div>
    <h2>Survey Submissions</h2>
    <p>Sign in to view door surveys submitted by customers.</p>
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" />
    </div>
    <button class="primary-btn" onclick="doLogin()">Sign in</button>
    <div class="login-error" id="login-error">Incorrect email or password.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="page" id="page-dashboard">
  <header class="app-header">
    <div>
      <h1>Survey Submissions</h1>
    </div>
    <button class="signout-btn" onclick="doSignOut()"><i class="ti ti-logout"></i> Sign out</button>
  </header>
  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" id="tab-surveys" onclick="setTab('surveys')"><i class="ti ti-clipboard-list"></i> Surveys</button>
      <button class="tab-btn" id="tab-insights" onclick="setTab('insights')"><i class="ti ti-chart-bar"></i> Insights</button>
    </div>
    <div id="view-surveys">
      <div class="page-intro">
        <h2>Recent surveys</h2>
        <p id="dash-count-text">Loading…</p>
      </div>
      <div class="range-row" id="list-filter">
        <button class="range-chip active" data-f="active" onclick="setListFilter('active')">Active</button>
        <button class="range-chip" data-f="archived" onclick="setListFilter('archived')">Archived</button>
      </div>
      <div id="sub-list"></div>
    </div>
    <div id="view-insights" style="display:none;">
      <div class="page-intro">
        <h2>Insights</h2>
        <p>Residential surveys only</p>
      </div>
      <div class="range-row" id="range-row">
        <button class="range-chip" data-r="30" onclick="setRange(30)">30 days</button>
        <button class="range-chip" data-r="90" onclick="setRange(90)">90 days</button>
        <button class="range-chip active" data-r="0" onclick="setRange(0)">All time</button>
      </div>
      <div id="stats-body"></div>
    </div>
  </div>
</div>

<!-- DETAIL -->
<div class="page" id="page-detail">
  <header class="app-header">
    <button class="back-btn" onclick="showPage('page-dashboard')">
      <i class="ti ti-arrow-left"></i> Back
    </button>
    <div class="header-icon"><i class="ti ti-door"></i></div>
  </header>
  <div class="wrap">
    <div class="detail-header-card" id="detail-header"></div>
    <div id="detail-doors"></div>
    <div class="actions-zone">
      <button class="export-btn" id="export-pdf-btn" onclick="exportSubmissionPDF()">
        <i class="ti ti-file-type-pdf"></i> Export as PDF
      </button>
      <button class="archive-btn" id="archive-btn" onclick="toggleArchive()"></button>
    </div>
    <div class="danger-zone">
      <button class="delete-btn" onclick="confirmDeleteSubmission()">
        <i class="ti ti-trash"></i> Delete this survey
      </button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <div class="modal-title" id="confirm-modal-title">Delete this survey?</div>
    <div class="modal-msg" id="confirm-modal-msg">This will permanently remove the survey and its photos. This cannot be undone.</div>
    <div class="modal-btns">
      <button class="modal-confirm" onclick="deleteSubmission()">Delete survey</button>
      <button class="modal-cancel" onclick="closeConfirmModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="" />
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBK6pUCdL0a6Tb5FwDqnZZCwJ0J-YC1EQc",
  authDomain: "emmerson-s-door-site-survey.firebaseapp.com",
  projectId: "emmerson-s-door-site-survey",
  storageBucket: "emmerson-s-door-site-survey.firebasestorage.app",
  messagingSenderId: "659606435757",
  appId: "1:659606435757:web:39f49b0c0daa8034c6d324"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let submissions = [];
let activeSubmission = null;

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  document.getElementById('login-error').style.display = 'none';
  auth.signInWithEmailAndPassword(email, password).catch(() => {
    document.getElementById('login-error').style.display = 'block';
  });
}

function doSignOut() {
  auth.signOut();
}

auth.onAuthStateChanged((user) => {
  if (user) {
    showPage('page-dashboard');
    loadSubmissions();
  } else {
    showPage('page-login');
  }
});

function loadSubmissions() {
  document.getElementById('dash-count-text').textContent = 'Loading…';
  db.collection('submissions').orderBy('submittedAt', 'desc').limit(500).get()
    .then((snap) => {
      submissions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderSubList();
      renderStats();
    })
    .catch((err) => {
      console.error(err);
      document.getElementById('dash-count-text').textContent = 'Could not load submissions.';
    });
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' }) +
         ' · ' + d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
}

let listFilter = 'active';

function setListFilter(f) {
  listFilter = f;
  renderSubList();
}

function renderSubList() {
  const list = document.getElementById('sub-list');
  const nArch = submissions.filter(s => s.archived).length;
  const nActive = submissions.length - nArch;
  document.querySelectorAll('#list-filter .range-chip').forEach(c => {
    const f = c.dataset.f;
    c.classList.toggle('active', f === listFilter);
    c.textContent = (f === 'active' ? 'Active' : 'Archived') + ' (' + (f === 'active' ? nActive : nArch) + ')';
  });
  const shown = listFilter === 'archived' ? nArch : nActive;
  document.getElementById('dash-count-text').textContent =
    shown + (listFilter === 'archived' ? ' archived' : '') + ' survey' + (shown === 1 ? '' : 's') + (listFilter === 'archived' ? '' : ' to review');

  if (shown === 0) {
    list.innerHTML = listFilter === 'archived'
      ? '<div class="empty-state">No archived surveys.<br>Archive a survey from its detail page when you\'re done with it.</div>'
      : (submissions.length === 0
        ? '<div class="empty-state">No surveys submitted yet.<br>Once a customer submits from the survey app, it\'ll show up here.</div>'
        : '<div class="empty-state">All caught up — no active surveys.</div>');
    return;
  }

  list.innerHTML = submissions.map((s, i) => {
    if (!!s.archived !== (listFilter === 'archived')) return '';
    const title = [s.client, s.site].filter(Boolean).join(' — ') || 'Unnamed job';
    const typeLabel = s.jobType === 'residential' ? 'Residential' : 'Commercial';
    return `<div class="sub-card" onclick="openSubmission(${i})">
      <div class="sub-badge"><i class="ti ti-${s.jobType === 'residential' ? 'home' : 'building'}"></i></div>
      <div class="sub-info">
        <div class="sub-title">${escapeHTML(title)}</div>
        <div class="sub-meta">
          <span class="type-tag">${typeLabel}</span>${s.archived ? '<span class="archived-tag">Archived</span>' : ''}
          <span>${s.doorCount || 0} door${s.doorCount === 1 ? '' : 's'}</span>
          <span>${s.photoCount || 0} photo${s.photoCount === 1 ? '' : 's'}</span>
        </div>
        <div class="sub-meta">${fmtDate(s.submittedAt)}</div>
        ${s.phone ? `<div class="sub-meta"><i class="ti ti-phone" style="font-size:12px;"></i> ${escapeHTML(s.phone)}</div>` : ''}
      </div>
      <div class="sub-arrow"><i class="ti ti-chevron-right"></i></div>
    </div>`;
  }).join('');
}

/* ---------- Insights ---------- */
let statsRange = 0;

function setTab(t) {
  document.getElementById('view-surveys').style.display = t === 'surveys' ? '' : 'none';
  document.getElementById('view-insights').style.display = t === 'insights' ? '' : 'none';
  document.getElementById('tab-surveys').classList.toggle('active', t === 'surveys');
  document.getElementById('tab-insights').classList.toggle('active', t === 'insights');
  if (t === 'insights') renderStats();
}

function setRange(r) {
  statsRange = r;
  document.querySelectorAll('.range-chip').forEach(c => c.classList.toggle('active', Number(c.dataset.r) === r));
  renderStats();
}

function subDate(s) {
  const t = s.submittedAt;
  if (!t) return null;
  return t.toDate ? t.toDate() : new Date(t);
}

function tally(map, v) {
  const k = String(v == null ? '' : v).trim();
  if (k) map[k] = (map[k] || 0) + 1;
}

function topList(map, n) {
  return Object.entries(map).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, n);
}

function hbars(entries) {
  if (!entries.length) return '<div class="stat-empty">No data yet.</div>';
  const max = entries[0][1];
  return entries.map(([k, v]) => `<div class="hbar-row">
    <div class="hbar-top"><span>${escapeHTML(k)}</span><span>${v}</span></div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(4, v / max * 100)}%"></div></div>
  </div>`).join('');
}

function startOfWeek(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // Monday
  return x;
}

function renderStats() {
  const body = document.getElementById('stats-body');
  if (!body) return;
  const now = new Date();
  const cutoff = statsRange ? new Date(now.getTime() - statsRange * 86400000) : null;
  const resAll = submissions.filter(s => s.jobType === 'residential');
  const subs = resAll.filter(s => {
    if (!cutoff) return true;
    const d = subDate(s);
    return d && d >= cutoff;
  });

  if (!subs.length) {
    body.innerHTML = '<div class="empty-state">No residential surveys in this period yet.</div>';
    return;
  }

  let doors = 0, photos = 0;
  const types = {}, swing = {}, outcome = {}, clients = {}, dow = [0,0,0,0,0,0,0];
  subs.forEach(s => {
    const dc = (s.doors && s.doors.length) || s.doorCount || 0;
    doors += dc;
    photos += s.photoCount || 0;
    if (s.client) tally(clients, s.client);
    const d = subDate(s);
    if (d) dow[d.getDay()]++;
    (s.doors || []).forEach(dr => {
      tally(types, dr.type);
      tally(swing, dr.swing);
      (dr.outcome || []).forEach(v => tally(outcome, v));
    });
  });

  // surveys per week, last 8 weeks
  const wk0 = startOfWeek(now);
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const d = new Date(wk0); d.setDate(d.getDate() - i * 7);
    weeks.push({ start: d, n: 0 });
  }
  resAll.forEach(s => {
    const d = subDate(s);
    if (!d) return;
    for (let i = weeks.length - 1; i >= 0; i--) {
      if (d >= weeks[i].start) { weeks[i].n++; break; }
    }
  });
  const wmax = Math.max(1, ...weeks.map(w => w.n));
  const wpeak = Math.max(...weeks.map(w => w.n));

  // busiest day (Mon-first order)
  const names = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const order = [1,2,3,4,5,6,0];
  const dmax = Math.max(1, ...dow);

  const total = subs.length;
  const repeat = topList(clients, 5).filter(([, v]) => v > 1);

  body.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-val">${total}</div><div class="kpi-label">Surveys</div></div>
      <div class="kpi"><div class="kpi-val">${doors}</div><div class="kpi-label">Doors surveyed</div></div>
      <div class="kpi"><div class="kpi-val">${(doors / total).toFixed(1)}</div><div class="kpi-label">Avg doors / survey</div></div>
      <div class="kpi"><div class="kpi-val">${photos}</div><div class="kpi-label">Photos taken</div></div>
    </div>

    <div class="stat-card">
      <h3><i class="ti ti-calendar-stats"></i> Surveys per week</h3>
      <div class="col-chart">${weeks.map(w => `<div class="col">
        <div class="col-n">${w.n || ''}</div>
        <div class="col-bar${w.n === wpeak && w.n > 0 ? ' hi' : ''}" style="height:${w.n / wmax * 88}px"></div>
        <div class="col-lab">${w.start.getDate()}/${w.start.getMonth() + 1}</div></div>`).join('')}</div>
      <div class="stat-note">Weeks starting Monday · last 8 weeks</div>
    </div>

    <div class="stat-card">
      <h3><i class="ti ti-clock"></i> Busiest days</h3>
      <div class="col-chart" style="height:100px">${order.map(i => `<div class="col">
        <div class="col-n">${dow[i] || ''}</div>
        <div class="col-bar${dow[i] === Math.max(...dow) && dow[i] > 0 ? ' hi' : ''}" style="height:${dow[i] / dmax * 70}px"></div>
        <div class="col-lab">${names[i]}</div></div>`).join('')}</div>
    </div>

    <div class="stat-card"><h3><i class="ti ti-door"></i> Door types</h3>${hbars(topList(types, 6))}</div>
    <div class="stat-card"><h3><i class="ti ti-arrows-left-right"></i> Door swing</h3>${hbars(topList(swing, 4))}</div>
    <div class="stat-card"><h3><i class="ti ti-tools"></i> Work needed</h3>${hbars(topList(outcome, 8))}</div>
    <div class="stat-card"><h3><i class="ti ti-repeat"></i> Repeat clients</h3>${repeat.length ? hbars(repeat) : '<div class="stat-empty">No repeat clients in this period.</div>'}</div>
    <div class="stat-note">Based on ${resAll.length} residential survey${resAll.length === 1 ? '' : 's'}${submissions.length >= 500 ? ' (limit reached — older surveys not counted)' : ''}.</div>
  `;
}

function escapeHTML(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function updateArchiveBtn() {
  const s = activeSubmission;
  const b = document.getElementById('archive-btn');
  if (!s || !b) return;
  b.disabled = false;
  b.innerHTML = s.archived
    ? '<i class="ti ti-archive-off"></i> Restore to active'
    : '<i class="ti ti-archive"></i> Archive this survey';
}

async function toggleArchive() {
  const s = activeSubmission;
  if (!s) return;
  const archiving = !s.archived;
  const b = document.getElementById('archive-btn');
  b.disabled = true;
  try {
    await db.collection('submissions').doc(s.id).update(
      archiving ? { archived: true, archivedAt: firebase.firestore.FieldValue.serverTimestamp() }
                : { archived: false, archivedAt: null });
    s.archived = archiving;
    renderSubList();
    renderStats();
    showPage('page-dashboard');
    showToast(archiving ? 'Survey archived' : 'Survey restored');
  } catch (err) {
    console.error(err);
    b.disabled = false;
    showToast('Could not update — check your connection and try again');
  }
}

async function openSubmission(idx) {
  activeSubmission = submissions[idx];
  const s = activeSubmission;
  updateArchiveBtn();
  const title = [s.client, s.site].filter(Boolean).join(' — ') || 'Unnamed job';
  const typeLabel = s.jobType === 'residential' ? 'Residential' : 'Commercial';

  document.getElementById('detail-header').innerHTML = `
    <h2>${escapeHTML(title)}</h2>
    <div class="meta-row"><span>Type:</span> ${typeLabel}</div>
    ${s.ref ? `<div class="meta-row"><span>Reference:</span> ${escapeHTML(s.ref)}</div>` : ''}
    ${s.contactName ? `<div class="meta-row"><span>Contact:</span> ${escapeHTML(s.contactName)}</div>` : ''}
    ${s.phone ? `<div class="meta-row"><span>Phone:</span> <a href="tel:${escapeHTML(s.phone)}">${escapeHTML(s.phone)}</a></div>` : ''}
    ${s.email ? `<div class="meta-row"><span>Email:</span> <a href="mailto:${escapeHTML(s.email)}">${escapeHTML(s.email)}</a></div>` : ''}
    <div class="meta-row"><span>Submitted:</span> ${fmtDate(s.submittedAt)}</div>
    <div class="meta-row"><span>${s.doorCount || 0} door${s.doorCount === 1 ? '' : 's'} · ${s.photoCount || 0} photo${s.photoCount === 1 ? '' : 's'}</span></div>
  `;

  const doors = s.doors || [];
  document.getElementById('detail-doors').innerHTML = doors.map((d, i) =>
    `<div class="door-card" id="door-card-${i}">${renderDoorCardShell(s, d)}</div>`
  ).join('');
  showPage('page-detail');

  // Resolve each door's photo paths to viewable URLs now that we're signed in
  for (let i = 0; i < doors.length; i++) {
    const d = doors[i];
    const paths = d.photoPaths || d.photoURLs || []; // photoURLs kept for backward compatibility with old submissions
    if (!paths.length) continue;
    try {
      const urls = await Promise.all(paths.map(p =>
        p.startsWith('http') ? p : storage.ref(p).getDownloadURL()
      ));
      d._resolvedUrls = urls;
      const card = document.getElementById(`door-card-${i}`);
      if (card) card.innerHTML = renderDoorCardShell(s, d, urls);
    } catch (e) {
      console.error('Failed to load photos for door', d.doorNo, e);
    }
  }
}

function renderDoorCardShell(s, d, urls) {
  const label = d.name || ('Door ' + d.doorNo);
  const fields = s.jobType === 'residential'
    ? [['Door type', d.type], ['Swing', d.swing],
       ['Desired outcome', Array.isArray(d.outcome) && d.outcome.length ? d.outcome.join(', ') : null],
       ['Notes', d.notes]]
    : [['Plan / stamp no.', d.planNo], ['Area', d.area], ['Door type', d.type],
       ['What to supply and install', Array.isArray(d.supply) && d.supply.length ? d.supply.join(', ') : null],
       ['Cylinder', Array.isArray(d.cylinder) && d.cylinder.length ? d.cylinder.join(', ') + (d.cam ? ' — ' + d.cam : '') : null],
       ['Notes', d.notes]];

  const fieldsHTML = fields.filter(([, v]) => v).map(([label, val]) =>
    `<div class="df"><div class="df-label">${label}</div><div class="df-val">${escapeHTML(val)}</div></div>`
  ).join('');

  const photoCount = (d.photoPaths || d.photoURLs || []).length;
  let photosHTML = '';
  if (photoCount && urls) {
    photosHTML = `<div class="df">
        <div class="df-label">Photos (${photoCount})</div>
        <div class="door-photos">${urls.map(url => `<img src="${url}" onclick="event.stopPropagation();openLightbox('${url}')" loading="lazy" />`).join('')}</div>
      </div>`;
  } else if (photoCount) {
    photosHTML = `<div class="df">
        <div class="df-label">Photos (${photoCount})</div>
        <div class="door-photos" style="font-size:12px;color:var(--text-muted);">Loading…</div>
      </div>`;
  }

  return `
    <div class="door-card-header"><div class="door-num">${d.doorNo}</div>${escapeHTML(label)}</div>
    <div class="door-card-body">${fieldsHTML || '<div class="df-val" style="color:var(--text-muted);font-style:italic;">No details recorded</div>'}${photosHTML}</div>
  `;
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

/* ---------- PDF export ---------- */

// Fetch an image URL and resolve to { dataUrl, width, height }. Skips (resolves null)
// on any failure so one bad photo doesn't stop the whole export.
function loadImageAsDataURL(url) {
  return fetch(url)
    .then(res => {
      if (!res.ok) throw new Error('fetch failed: ' + res.status);
      return res.blob();
    })
    .then(blob => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    }))
    .then(dataUrl => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve({ dataUrl, width: img.naturalWidth, height: img.naturalHeight });
      img.onerror = reject;
      img.src = dataUrl;
    }))
    .catch(err => {
      console.warn('Could not load photo for PDF:', url, err);
      return null;
    });
}

async function exportSubmissionPDF() {
  const s = activeSubmission;
  if (!s) return;

  const btn = document.getElementById('export-pdf-btn');
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Generating PDF…';

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 40;
    const contentW = pageW - margin * 2;
    let y = margin;

    const brand = [18, 48, 77];
    const textMuted = [110, 110, 105];
    const textMain = [26, 26, 24];

    function ensureSpace(needed) {
      if (y + needed > pageH - margin) {
        doc.addPage();
        y = margin;
      }
    }

    function heading(text, size, color, spacingAfter) {
      ensureSpace(size + 6);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(size);
      doc.setTextColor(...color);
      doc.text(text, margin, y);
      y += size + (spacingAfter || 6);
    }

    function bodyLine(label, value) {
      if (!value) return;
      ensureSpace(14);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.setTextColor(...textMuted);
      doc.text(String(label).toUpperCase(), margin, y);
      y += 12;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(11);
      doc.setTextColor(...textMain);
      const lines = doc.splitTextToSize(String(value), contentW);
      for (const line of lines) {
        ensureSpace(14);
        doc.text(line, margin, y);
        y += 14;
      }
      y += 4;
    }

    // Title block
    const title = [s.client, s.site].filter(Boolean).join(' — ') || 'Unnamed job';
    heading('Emmerson Locksmiths & Security', 10, textMuted, 14);
    heading(title, 16, brand, 10);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    doc.setTextColor(...textMain);
    const typeLabel = s.jobType === 'residential' ? 'Residential' : 'Commercial';
    const introLines = [
      `Type: ${typeLabel}`,
      s.ref ? `Reference: ${s.ref}` : null,
      s.contactName ? `Contact: ${s.contactName}` : null,
      s.phone ? `Phone: ${s.phone}` : null,
      s.email ? `Email: ${s.email}` : null,
      `Submitted: ${fmtDate(s.submittedAt)}`,
      `${s.doorCount || 0} door${s.doorCount === 1 ? '' : 's'} · ${s.photoCount || 0} photo${s.photoCount === 1 ? '' : 's'}`
    ].filter(Boolean);
    for (const line of introLines) {
      ensureSpace(14);
      doc.text(line, margin, y);
      y += 14;
    }
    y += 10;
    ensureSpace(1);
    doc.setDrawColor(184, 145, 63);
    doc.line(margin, y, pageW - margin, y);
    y += 18;

    const doors = s.doors || [];
    for (const d of doors) {
      const label = d.name || ('Door ' + d.doorNo);
      heading(`Door ${d.doorNo} — ${label}`, 12.5, brand, 10);

      if (s.jobType === 'residential') {
        bodyLine('Door type', d.type);
        bodyLine('Swing', d.swing);
        bodyLine('Desired outcome', Array.isArray(d.outcome) && d.outcome.length ? d.outcome.join(', ') : null);
        bodyLine('Notes', d.notes);
      } else {
        bodyLine('Plan / stamp no.', d.planNo);
        bodyLine('Area', d.area);
        bodyLine('Door type', d.type);
        bodyLine('What to supply and install', Array.isArray(d.supply) && d.supply.length ? d.supply.join(', ') : null);
        bodyLine('Cylinder', Array.isArray(d.cylinder) && d.cylinder.length ? d.cylinder.join(', ') + (d.cam ? ' — ' + d.cam : '') : null);
        bodyLine('Notes', d.notes);
      }

      // Photos
      const paths = d.photoPaths || d.photoURLs || [];
      if (paths.length) {
        let urls = d._resolvedUrls;
        if (!urls) {
          try {
            urls = await Promise.all(paths.map(p =>
              p.startsWith('http') ? p : storage.ref(p).getDownloadURL()
            ));
          } catch (e) {
            console.warn('Could not resolve photo URLs for door', d.doorNo, e);
            urls = [];
          }
        }

        const loaded = (await Promise.all(urls.map(loadImageAsDataURL))).filter(Boolean);
        if (loaded.length) {
          ensureSpace(14);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9.5);
          doc.setTextColor(...textMuted);
          doc.text(`PHOTOS (${loaded.length})`, margin, y);
          y += 12;

          const thumb = 130; // square thumbnail box, pt
          const gap = 10;
          let x = margin;
          let rowMaxH = 0;
          for (const img of loaded) {
            if (x + thumb > margin + contentW) {
              x = margin;
              y += rowMaxH + gap;
              rowMaxH = 0;
            }
            ensureSpace(thumb + gap);
            // fit image inside thumb x thumb box, preserving aspect ratio
            const ratio = Math.min(thumb / img.width, thumb / img.height);
            const w = img.width * ratio;
            const h = img.height * ratio;
            const drawX = x + (thumb - w) / 2;
            const drawY = y + (thumb - h) / 2;
            try {
              doc.addImage(img.dataUrl, drawX, drawY, w, h);
            } catch (e) {
              console.warn('Could not embed photo in PDF:', e);
            }
            rowMaxH = Math.max(rowMaxH, thumb);
            x += thumb + gap;
          }
          y += rowMaxH + gap;
        }
      }

      y += 6;
    }

    const fname = `${(s.client || 'survey')}-${(s.site || '')}`.trim()
      .replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'door-survey';
    doc.save(`${fname}.pdf`);
    showToast('PDF downloaded');
  } catch (err) {
    console.error('PDF export failed', err);
    showToast('Could not generate PDF — try again');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  }
}

function confirmDeleteSubmission() {
  const s = activeSubmission;
  if (!s) return;
  const title = [s.client, s.site].filter(Boolean).join(' — ') || 'this survey';
  document.getElementById('confirm-modal-title').textContent = 'Delete "' + title + '"?';
  document.getElementById('confirm-modal-msg').textContent =
    `This will permanently remove the survey and its ${s.photoCount || 0} photo${s.photoCount === 1 ? '' : 's'}. This cannot be undone.`;
  document.getElementById('confirm-modal').classList.add('open');
}

function closeConfirmModal() {
  document.getElementById('confirm-modal').classList.remove('open');
}

async function deleteSubmission() {
  const s = activeSubmission;
  if (!s) return;
  closeConfirmModal();
  showToast('Deleting…');

  try {
    // Delete every photo in Storage first
    const doors = s.doors || [];
    const deletions = [];
    for (const d of doors) {
      const paths = d.photoPaths || d.photoURLs || [];
      for (const p of paths) {
        const ref = p.startsWith('http') ? storage.refFromURL(p) : storage.ref(p);
        deletions.push(ref.delete().catch(e => console.warn('Photo delete failed (continuing):', p, e)));
      }
    }
    await Promise.allSettled(deletions);

    // Then delete the Firestore record
    await db.collection('submissions').doc(s.id).delete();

    // Update local state and go back to the list
    submissions = submissions.filter(sub => sub.id !== s.id);
    activeSubmission = null;
    renderSubList();
    showPage('page-dashboard');
    showToast('Survey deleted');
  } catch (err) {
    console.error(err);
    showToast('Delete failed — check your connection and try again');
  }
}
